<style>

.lift .go{flex-shrink:0;padding:9px 12px;background:var(--maroon);color:#fff;border-radius:8px;font-size:14px;font-weight:600}
.more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.seg button.on{background:var(--maroon);color:#fff}
.card{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 1px 3px #1E1A1914}
.rmrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr);justify-items:center;align-items:center;gap:4px;height:42px;padding:0 12px;border-bottom:1px solid var(--line);font-size:15px}
.rmrow:last-child{border-bottom:0}
.rmrow.head{height:40px;background:var(--maroon);color:#fff;font-size:13px;font-weight:600;border-bottom:0}
.rmrow .d{color:var(--mute)}
.wk{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px #1E1A1914;overflow:hidden}
.wk.open{background:var(--hi);border-color:#EBCFD3;border-left:4px solid var(--maroon)}
.wkh{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;padding:8px 14px;width:100%;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.wkh .t{display:flex;align-items:baseline;gap:8px}
.wkh .t b{font-size:16px;font-weight:600}
.wkh .t span,.wkh .u{font-size:13px;color:var(--mute)}
.wkh .u{white-space:nowrap;display:block;margin-top:2px}
.wkb{background:#fff;border-top:1px solid #EBCFD3;padding:6px 14px 10px}
.srow{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1fr);justify-items:center;align-items:center;height:30px;font-size:15px}
.srow.h{font-size:12px;font-weight:600;color:var(--mute);height:26px}
.srow.j{background:#F4EEEC;border-radius:6px;margin-top:2px}
.wknote{margin-top:8px;font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.btn.out{height:44px;border:1px solid var(--maroon);border-radius:10px;font-size:14px;color:var(--maroon)}
.btn.sm{height:44px;border-radius:10px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px}
.stat .k{font-size:12px;font-weight:600;color:var(--mute)}
.stat .v{font-size:20px;font-weight:700}
.chips{display:grid;grid-template-columns:repeat(3,auto);gap:2px;padding:2px;background:var(--dis);border-radius:8px}
.chips button{padding:4px 8px;border:0;border-radius:6px;background:transparent;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer}
.chips button.on{background:var(--maroon);color:#fff}
.chartempty{padding:40px 16px;text-align:center;font-size:14px;color:var(--mute)}
.ag{display:grid;grid-template-columns:56px repeat(5,minmax(0,1fr));gap:6px;align-items:center}
.ag.h{align-items:end;font-size:11px;font-weight:600;color:var(--mute);text-align:center}
.ag.h span:first-child{text-align:left}
.ag .w{font-size:14px;font-weight:600}
.ag input{height:40px;padding:0 4px;border-radius:8px;font-size:15px;text-align:center}
.ag .na{height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--dis);font-size:15px;color:var(--mute)}
.urow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urow .em{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{margin-left:4px;padding:2px 6px;border-radius:6px;background:#F3DDE0;font-size:11px;font-weight:600;color:var(--maroon)}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--mute)}
.link{color:var(--maroon);font-weight:600;background:none;border:0;font-size:inherit;cursor:pointer;padding:10px 0}
.center{align-self:center}
.banner{padding:10px 12px;border-radius:10px;background:#F3E4E6;color:var(--maroon);font-size:13px;font-weight:600}
.signin{justify-content:center;gap:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

<body>
<div id="app"><div class="screen"><div class="spinner">Loading…</div></div></div>
<script src="supabase.js"></script>
<script>
/* ========= connection (publishable key is safe in the browser; row security protects the data) ========= */
const SUPABASE_URL = 'https://ewvtlixlsxqkujzxjfuh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8WWfArHOR9EQxJDhRhWNSA_-LsmrzhA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const LIFTS = ['Bench', 'Deadlift', 'Shoulder Press', 'Squat'];
const JOKER_PROGRAM = '5/3/1 with Jokers';
const FORMULAS = ['Epley', 'Brzycki', 'Landers', 'Lombardi'];

/* ========= pure logic (also used by the tests) ========= */
const Logic = {
  mround(x, m) { return Math.round(x / m) * m; },
  fmt(w) { return String(+Number(w).toFixed(2)); },
  est1RM(formula, w, r) {
    w = Number(w); r = Number(r);
    if (!(w > 0) || !(r >= 1)) return null;
    let v;
    switch (formula) {
      case 'Epley': v = w * (1 + r / 30); break;
      case 'Landers': v = w / (1.013 - 0.0267123 * r); break;
      case 'Lombardi': v = w * Math.pow(r, 0.10); break;
      default: v = w / (1.0278 - 0.0278 * r); // Brzycki
    }
    if (!isFinite(v) || v <= 0) return null;
    return Math.round(v);
  },
  isDeload(sch) { return !sch || sch.jk_sets == null; },
  // target reps for sets 1-3. Week 3 is the 5/3/1 week; every other week is the same number three times.
  targets(week, sch) { return Number(week) === 3 ? [5, 3, sch.reps] : [sch.reps, sch.reps, sch.reps]; },
  workingWeights(orm, sch, tm, rnd) {
    return [sch.pct_set1, sch.pct_set2, sch.pct_set3].map(p => Logic.mround(tm * orm * p, rnd));
  },
  // jokers only exist once earned: Set 3 reps >= jk_sets for Joker 1, then previous joker reps >= reps for the next
  jokerPlan(sch, set3Weight, js, reps, rnd, jokersOn) {
    const out = [];
    if (!jokersOn || Logic.isDeload(sch) || !(set3Weight > 0)) return out;
    const r3 = parseInt(reps.w3, 10);
    if (!(r3 >= sch.jk_sets)) return out;
    let prev = set3Weight;
    for (let n = 1; n < 40; n++) {
      const w = Logic.mround(prev * (1 + js), rnd);
      out.push({ n, weight: w });
      const v = parseInt(reps['j' + n], 10);
      if (!(v >= sch.reps)) break;
      prev = w;
    }
    return out;
  },
  nextWeek(last) { return !last ? 1 : (last.week >= 4 ? 1 : last.week + 1); }
};

/* ========= app state ========= */
const S = {
  session: null, scheme: {}, settings: null, last: {}, loaded: false, loadError: null,
  menuOpen: false, calc: null, busy: false,
  isAdmin: false, wk: {}, rm: null, lg: null, pg: null
};
const DEFAULTS = { one_rm_formula: 'Brzycki', training_max_pct: 0.9, weight_rounding: 5, default_js_percent: 0.05, display_name: null, program: JOKER_PROGRAM };

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = () => document.getElementById('app');
const svgHome = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7D1531" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>';
const svgPen = c => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/></svg>`;
const svgSet = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7D1531" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>';
const svgLog = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7D1531" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>';
const svgProg = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7D1531" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>';
const svgBars = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7D1531" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>';

const svgLock = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7D1531" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const svgChevR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B625E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const svgChevD = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B625E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const svgInfo = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B625E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';
const svgDown = c => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>`;
const svgTrash = c => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>`;

function userName() {
  const d = S.settings && S.settings.display_name;
  if (d && d.trim()) return d.trim();
  const e = S.session && S.session.user && S.session.user.email || '';
  return e.split('@')[0] || 'there';
}
const settings = () => Object.assign({}, DEFAULTS, S.settings || {});
const jokersOn = () => settings().program === JOKER_PROGRAM;

/* ========= data ========= */
async function loadCore() {
  S.loadError = null;
  const uid = S.session.user.id;
  const [sch, ud, adm] = await Promise.all([
    sb.from('week_scheme').select('*').order('week'),
    sb.from('user_details').select('*').eq('user_id', uid).limit(1),
    sb.rpc('is_admin')
  ]);
  if (sch.error) throw sch.error;
  if (ud.error) throw ud.error;
  S.isAdmin = !adm.error && adm.data === true; // if the update-2 SQL hasn't been run yet this is just false
  S.scheme = {};
  (sch.data || []).forEach(r => { S.scheme[r.week] = r; });
  S.settings = (ud.data && ud.data[0]) || null;
  S.loaded = true;
}

async function loadLast() {
  const res = await Promise.all(LIFTS.map(l =>
    sb.from('workout_log').select('id,lift,week,workout_date,original_1rm').eq('lift', l)
      .order('workout_date', { ascending: false }).limit(1)));
  const rows = [];
  res.forEach(r => { if (r.error) throw r.error; if (r.data && r.data[0]) rows.push(r.data[0]); });
  const last = {};
  rows.forEach(r => { last[r.lift] = Object.assign({}, r, { set3: null }); });
  if (rows.length) {
    const s = await sb.from('set_log').select('workout_id,weight,reps').in('workout_id', rows.map(r => r.id))
      .eq('set_type', 'Working').eq('set_number', 3);
    if (s.error) throw s.error;
    (s.data || []).forEach(x => {
      const l = rows.find(r => r.id === x.workout_id);
      if (l) last[l.lift].set3 = { weight: x.weight, reps: x.reps };
    });
  }
  S.last = last;
}

/* ========= router ========= */
function parseRoute() {
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, q] = h.split('?');
  return { path, params: new URLSearchParams(q || '') };
}

async function route() {
  const r = parseRoute();
  if (!S.session) return renderSignIn();
  if (!S.loaded) {
    app().innerHTML = '<div class="screen"><div class="spinner">Loading…</div></div>';
    try { await loadCore(); } catch (e) { return renderError(e); }
  }
  if (r.path === '/settings') return renderSettings();
  if (r.path === '/calc') return enterCalc(r.params);
  if (r.path === '/log') return renderLog();
  if (r.path === '/progress') return renderProgress();
  if (r.path === '/repmaxes') return renderRepMaxes();
  if (r.path === '/admin') { if (S.isAdmin) return renderAdmin(); location.hash = '#/'; return; }
  return renderHome();
}
window.addEventListener('hashchange', () => {
  S.menuOpen = false;
  document.querySelectorAll('.sheet').forEach(x => x.remove());
  route();
});

function renderError(e) {
  console.error(e);
  app().innerHTML = `<div class="screen"><div class="top"><div class="wm">5/3/1</div></div>
    <div class="banner">Couldn't load your data. Check your connection and try again.<br><span style="font-weight:400">${esc(e && e.message || e)}</span></div>
    <button class="btn primary" data-act="retry">Try again</button>
    <button class="link center" data-act="signout">Sign out</button></div>`;
}

/* ========= sign in ========= */
function renderSignIn(msg) {
  app().innerHTML = `<div class="screen signin">

  const st = settings();
  let lift = params.get('lift'); if (!LIFTS.includes(lift)) lift = 'Bench';
  let week = parseInt(params.get('week'), 10);
  if (!S.scheme[week]) week = Logic.nextWeek(S.last[lift]);
  const js = [0.05, 0.10, 0.15].includes(Number(st.default_js_percent)) ? Number(st.default_js_percent) : 0.05;
  S.calc = { lift, week, js, orm: '', reps: {}, note: '', saving: false };
  setOrmFromLast();
  renderCalc();

}

// recompute every number on screen without touching what the user is typing in
function syncAll() {
  const c = S.calc; if (!c) return;
  const st = settings(), sch = S.scheme[c.week];
  const orm = parseFloat(c.orm), rnd = Number(st.weight_rounding) || 5, tm = Number(st.training_max_pct) || 0.9;
  const pcts = [sch.pct_set1, sch.pct_set2, sch.pct_set3];
  const ws = orm > 0 ? Logic.workingWeights(orm, sch, tm, rnd) : [null, null, null];
  c.weights = ws;
  [1, 2, 3].forEach(i => {
    $('#p' + i).textContent = Math.round(pcts[i - 1] * 100) + '%';
    $('#w' + i).textContent = ws[i - 1] == null ? '–' : Logic.fmt(ws[i - 1]);
  });
  // jokers
  const plan = Logic.jokerPlan(sch, ws[2], c.js, c.reps, rnd, jokersOn());
  c.plan = plan;
  const box = $('#jokers');
  while (box.children.length > plan.length) {
    const last = box.lastElementChild; delete c.reps['j' + last.dataset.n]; box.removeChild(last);
  }
  plan.forEach((j, idx) => {
    let row = box.children[idx];
    if (!row) {
      row = document.createElement('div');
      row.className = 'tr jk'; row.dataset.n = j.n;
      row.innerHTML = `<b>J${j.n}</b><span>${Math.round(c.js * 100)}%</span><b class="jw"></b><span>${sch.reps}</span>
        <input type="number" inputmode="numeric" min="0" max="99" data-key="j${j.n}" aria-label="Joker ${j.n} actual reps" value="${esc(c.reps['j' + j.n] || '')}">`;
      box.appendChild(row);
    }
    row.children[1].textContent = Math.round(c.js * 100) + '%';
    $('.jw', row).textContent = Logic.fmt(j.weight);
    row.classList.toggle('next', idx === plan.length - 1 && !(c.reps['j' + j.n] || '').toString().length);
  });
  // calculated 1RM from Set 3
  const calc = $('#calc');
  const v = Logic.isDeload(sch) ? null : Logic.est1RM(st.one_rm_formula, ws[2], parseInt(c.reps.w3, 10));
  calc.textContent = v == null ? '—' : v;
  calc.classList.toggle('none', v == null);
  c.calc1rm = v;
  $('#notelbl').textContent = c.note ? 'Edit note' : 'Add note';
}

function setMsg(t, ok) { const m = $('#msg'); if (m) { m.textContent = t || ''; m.className = 'msg' + (ok ? ' ok' : ''); } }

async function saveWorkout() {
  const c = S.calc; if (!c || c.saving) return;
  const st = settings(), sch = S.scheme[c.week], deload = Logic.isDeload(sch);
  const orm = parseFloat(c.orm);
  if (!(orm > 0)) return setMsg('Enter your 1 Rep Max first.');
  const sets = [];
  for (let i = 1; i <= 3; i++) {
    const raw = (c.reps['w' + i] || '').toString().trim();
    const r = parseInt(raw, 10);
    if (raw === '' || !(r >= 0) || r > 99) return setMsg(`Enter the reps for Set ${i}.`);
    sets.push({ set_type: 'Working', set_number: i, weight: c.weights[i - 1], reps: r });
  }
  c.plan.forEach(j => {
    const raw = (c.reps['j' + j.n] || '').toString().trim();
    if (raw === '') return; // jokers you didn't do aren't saved
    const r = parseInt(raw, 10);
    if (r >= 0 && r <= 99) sets.push({ set_type: 'Joker', set_number: j.n, weight: j.weight, reps: r });
  });
  c.saving = true; $('#savebtn').disabled = true; setMsg('Saving…', true);
  const withJk = jokersOn() && !deload;
  const { data, error } = await sb.rpc('save_workout', {
    p_lift: c.lift, p_week: c.week, p_original_1rm: orm,
    p_js_percent: withJk ? c.js : null,
    p_calc_1rm: deload ? null : c.calc1rm,
    p_calc_formula: deload || c.calc1rm == null ? null : st.one_rm_formula,
    p_notes: c.note.trim() || null,
    p_sets: sets
  });
  if (error) {
    c.saving = false; $('#savebtn').disabled = false;
    console.error(error);
    return setMsg('Couldn’t save: ' + error.message);
  }
  S.last[c.lift] = { id: data, lift: c.lift, week: c.week, workout_date: new Date().toISOString(), original_1rm: orm, set3: { weight: sets[2].weight, reps: sets[2].reps } };
  setMsg('Saved ✓', true);
  S.wk = {};
  S.calc = null;
  setTimeout(() => { location.hash = '#/'; }, 700);
}

/* ========= workout history (used by Log, Progress, and the download) ========= */
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = d => new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
const isType = (s, t) => String(s.set_type).toLowerCase() === t;

async function fetchWorkouts(lift, fresh) {
  const key = lift || 'all';
  if (!fresh && S.wk[key]) return S.wk[key];
  const rows = [];
  for (let from = 0; ; from += 1000) {
    let q = sb.from('workout_log')
      .select('id,lift,week,workout_date,original_1rm,js_percent,calc_1rm,calc_formula,notes,set_log(set_type,set_number,weight,reps)')
      .order('workout_date', { ascending: false }).order('id', { ascending: false }).range(from, from + 999);
    if (lift) q = q.eq('lift', lift);
    const { data, error } = await q;
    if (error) throw error;
    rows.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  const out = rows.map(r => {
    const sets = (r.set_log || []).slice().sort((a, b) =>
      isType(a, 'working') === isType(b, 'working') ? a.set_number - b.set_number : (isType(a, 'working') ? -1 : 1));
    return Object.assign({}, r, { sets, set3: sets.find(s => isType(s, 'working') && s.set_number === 3) || null });
  });
  S.wk[key] = out;
  return out;
}

// a tidy axis: returns {min, max, step} so the gridlines land on round numbers
function niceTicks(lo, hi, n) {
  if (hi === lo) { lo -= 2; hi += 2; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw);
  return { min: Math.floor(lo / step) * step, max: Math.ceil(hi / step) * step, step };
}

function paintRepMaxes() {
  const R = S.rm, body = $('#rmbody'); if (!body) return;

  if (!R.rows.length) { body.innerHTML = `<div class="card chartempty">No ${esc(R.lift)} sets yet. Save a workout and your rep maxes show up here.</div>`; return; }
  if (R.view === 'chart') {
    body.innerHTML = `<div class="card" style="padding:12px 8px 8px">${repMaxChart(R.rows, R.lift)}</div>
      <div class="info" style="margin-top:12px">${svgInfo}<span>Each bar is the most reps you've done at that weight.</span></div>`;
  } else {
    body.innerHTML = `<div class="card" style="overflow:hidden"><div class="rmrow head"><span>Weight</span><span>Max reps</span><span>Date</span></div>${
      R.rows.map(r => `<div class="rmrow"><b style="font-weight:600">${Logic.fmt(r.weight)}</b><span>${r.max_reps}</span><span class="d">${esc(fmtDate(r.achieved_at))}</span></div>`).join('')}</div>
      <div class="info" style="margin-top:12px">${svgInfo}<span>Heaviest first. Scroll for lighter weights.</span></div>`;
  }
}
function repMaxChart(rows, lift) {
  const d = rows.slice().sort((a, b) => a.weight - b.weight), n = d.length;
  const top = Math.max(...d.map(r => r.max_reps));
  const t = niceTicks(0, top, 4), X0 = 36, X1 = 344, Y0 = 260, Y1 = 20;
  const y = v => Y0 - (v - t.min) / (t.max - t.min) * (Y0 - Y1);
  let ticks = '', grid = '';
  for (let v = t.min; v <= t.max + 1e-9; v += t.step) {
    grid += `<line x1="${X0}" y1="${y(v)}" x2="${X1}" y2="${y(v)}"/>`;
    ticks += `<text x="30" y="${y(v) + 4}">${+v.toFixed(2)}</text>`;
  }
  const slot = (X1 - X0) / n, bw = Math.min(22, slot * 0.72), skip = Math.ceil(n / 10);
  let bars = '', vals = '', xl = '';
  d.forEach((r, i) => {
    const cx = X0 + slot * i + slot / 2;
    bars += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${y(r.max_reps).toFixed(1)}" width="${bw.toFixed(1)}" height="${(Y0 - y(r.max_reps)).toFixed(1)}" rx="${Math.min(3, bw / 3).toFixed(1)}"/>`;
    if (n <= 20) vals += `<text x="${cx.toFixed(1)}" y="${(y(r.max_reps) - 4).toFixed(1)}">${r.max_reps}</text>`;

  });

const METRICS = { calc: ['Calc 1RM', 'Calculated 1RM (lb)'], set3: ['Set 3 reps', 'Set 3 reps'], joker: ['Top joker', 'Top joker weight (lb)'] };
const RANGES = { '6m': ['6 mo', 183], '1y': ['1 yr', 365], all: ['All', null] };
function renderProgress() {
  const P = S.pg = S.pg || { lift: 'Bench', metric: 'calc', range: 'all', rows: null };
  P.rows = S.wk[P.lift] || null;

    P.rows = rows; paintProgress();
  }).catch(e => { console.error(e); if (parseRoute().path === '/progress') $('#pgbody').innerHTML = `<div class="banner">Couldn't load your workouts.<br><span style="font-weight:400">${esc(e && e.message || e)}</span></div>`; });
}
function metricPoints(rows, metric, range) {
  const cutoff = RANGES[range][1] ? Date.now() - RANGES[range][1] * 864e5 : -Infinity;
  const pts = [];
  rows.slice().reverse().forEach(r => {
    const t = new Date(r.workout_date).getTime(); if (t < cutoff) return;
    const deload = Logic.isDeload(S.scheme[r.week]);
    let v = null;
    if (metric === 'calc') v = r.calc_1rm != null ? Number(r.calc_1rm) : null;
    else if (metric === 'set3') v = !deload && r.set3 ? Number(r.set3.reps) : null;
    else { const j = r.sets.filter(s => isType(s, 'joker')).map(s => Number(s.weight)); v = j.length ? Math.max(...j) : null; }
    if (v != null && isFinite(v)) pts.push({ t, v });
  });
  return pts;
}
function paintProgress() {
  const P = S.pg;
  const liftOpts = LIFTS.map(l => `<option ${l === P.lift ? 'selected' : ''}>${esc(l)}</option>`).join('');
  const seg = Object.keys(METRICS).map(k => `<button data-act="pgmetric" data-v="${k}" class="${P.metric === k ? 'on' : ''}">${METRICS[k][0]}</button>`).join('');
  const chips = Object.keys(RANGES).map(k => `<button data-act="pgrange" data-v="${k}" class="${P.range === k ? 'on' : ''}">${RANGES[k][0]}</button>`).join('');
  let body;
  if (P.rows == null) body = '<div class="spinner" style="padding:30px 0;text-align:center">Loading…</div>';
  else {
    const pts = metricPoints(P.rows, P.metric, P.range);
    const best = pts.length ? Math.max(...pts.map(p => p.v)) : null, latest = pts.length ? pts[pts.length - 1].v : null;
    const empty = P.metric === 'joker' ? 'No joker sets in this range.' : 'Nothing to chart in this range yet. Save a workout and it shows up here.';
    body = `<div class="card" style="padding:10px 8px 6px">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0 6px 4px"><span style="font-size:12px;font-weight:600;color:var(--mute)">${METRICS[P.metric][1]}</span><div class="chips">${chips}</div></div>
        ${pts.length ? lineChart(pts, P) : `<div class="chartempty">${empty}</div>`}</div>
      <div class="stats">
        <div class="card stat"><span class="k">Best</span><span class="v" style="color:var(--maroon)">${best == null ? '–' : Logic.fmt(best)}</span></div>
        <div class="card stat"><span class="k">Latest</span><span class="v">${latest == null ? '–' : Logic.fmt(latest)}</span></div>
        <div class="card stat"><span class="k">Workouts</span><span class="v">${pts.length}</span></div></div>
      <div class="info" style="margin-top:auto">${svgInfo}<span>One dot per workout. The max-reps bar chart is under Rep Maxes.</span></div>`;
  }
  app().innerHTML = `<div class="screen nums">
    <div class="bar"><a class="homelink" href="#/">${svgHome} Home</a></div>
    <h1 class="s">Progress</h1>
    <div class="fld"><label for="pglift">Lift</label><select id="pglift">${liftOpts}</select></div>
    <div class="seg c3">${seg}</div>
    <div id="pgbody" style="display:contents">${body}</div></div>`;
}
function lineChart(pts, P) {
  const X0 = 48, X1 = 330, Y0 = 210, Y1 = 20;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, span = t1 - t0;
  const vals = pts.map(p => p.v), t = niceTicks(Math.min(...vals), Math.max(...vals), 4);
  const x = ti => pts.length === 1 || !span ? (X0 + X1) / 2 : X0 + (ti - t0) / span * (X1 - X0);
  const y = v => Y0 - (v - t.min) / (t.max - t.min) * (Y0 - Y1);
  let grid = '', ticks = '';
  for (let v = t.min; v <= t.max + 1e-9; v += t.step) {
    grid += `<line x1="36" y1="${y(v).toFixed(1)}" x2="344" y2="${y(v).toFixed(1)}"/>`;
    ticks += `<text x="30" y="${(y(v) + 4).toFixed(1)}">${+v.toFixed(2)}</text>`;
  }
  const line = pts.map(p => `${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const r = pts.length > 40 ? 2.5 : 4;
  const dots = pts.map(p => `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${r}"/>`).join('');
  const bi = vals.indexOf(Math.max(...vals)), bp = pts[bi], by = y(bp.v), bx = Math.min(Math.max(x(bp.t), 22), 328);
  const best = `<text x="${bx.toFixed(1)}" y="${(by < 34 ? by + 18 : by - 9).toFixed(1)}" font-size="11" font-weight="700" fill="#1E1A19" text-anchor="middle">${Logic.fmt(bp.v)}</text>`;
  // month labels at the 1st of each month in range (at most 4); short ranges get the first and last date instead
  let marks = [];
  const d0 = new Date(t0), first = new Date(d0.getFullYear(), d0.getMonth() + (d0.getDate() === 1 && d0.getHours() === 0 ? 0 : 1), 1);
  for (let d = first; d.getTime() <= t1; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) marks.push({ t: d.getTime(), s: `${MONTHS[d.getMonth()]} '${String(d.getFullYear()).slice(2)}` });
  if (marks.length > 4) marks = [0, 1, 2, 3].map(i => marks[Math.round(i * (marks.length - 1) / 3)]);
  if (!marks.length) {
    const sd = ms => { const d = new Date(ms); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; };
    marks = pts.length === 1 || !span ? [{ t: t0, s: sd(t0) }] : [{ t: t0, s: sd(t0) }, { t: t1, s: sd(t1) }];
  }
  const xl = marks.map(m => `<text x="${Math.min(Math.max(x(m.t), 24), 326).toFixed(1)}" y="230">${m.s}</text>`).join('');
  return `<svg viewBox="0 0 350 250" width="100%" role="img" aria-label="Line chart of ${esc(METRICS[P.metric][1])} over time for ${esc(P.lift)}" style="display:block">
    <g stroke="#EADFD8" stroke-width="1">${grid}</g>
    <g font-size="11" fill="#6B625E" text-anchor="end">${ticks}</g>
    <polyline fill="none" stroke="#7D1531" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${line}"/>
    <g fill="#7D1531" stroke="#FFFFFF" stroke-width="2">${dots}</g>${best}
    <g font-size="11" fill="#6B625E" text-anchor="middle">${xl}</g></svg>`;
}

const csvCell = v => { if (v == null) return ''; const s = String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function buildCsv(rows) {
  const asc = rows.slice().reverse();
  const maxJ = Math.max(4, ...asc.map(r => r.sets.filter(s => isType(s, 'joker')).length));
  const head = ['Date', '1RM', 'Lift', 'Week', 'Joker %', 'Set 1 Weight', 'Set 1 Reps', 'Set 2 Weight', 'Set 2 Reps', 'Set 3 Weight', 'Set 3 Reps', 'Calc 1RM'];
  for (let j = 1; j <= maxJ; j++) head.push(`Joker ${j} Weight`, `Joker ${j} Reps`);
  head.push('Formula', 'Notes');
  const p2 = n => String(n).padStart(2, '0');
  const lines = [head.map(csvCell).join(',')];
  asc.forEach(r => {
    const d = new Date(r.workout_date);
    const row = [`${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`,
      r.original_1rm, r.lift, r.week, r.js_percent == null ? '' : Logic.fmt(Math.round(r.js_percent * 1000) / 10) + '%'];
    for (let i = 1; i <= 3; i++) { const s = r.sets.find(x => isType(x, 'working') && x.set_number === i); row.push(s ? s.weight : '', s ? s.reps : ''); }
    row.push(r.calc_1rm);
    for (let j = 1; j <= maxJ; j++) { const s = r.sets.find(x => isType(x, 'joker') && x.set_number === j); row.push(s ? s.weight : '', s ? s.reps : ''); }
    row.push(r.calc_formula, r.notes);
    lines.push(row.map(csvCell).join(','));
  });
  return lines.join('\r\n');
}

    const num = f => parseFloat($(`#ar-${w}-${f}`).value);
    const label = dl ? 'Deload' : 'Week ' + w;
    const reps = num('reps'); if (!(Number.isInteger(reps) && reps >= 1 && reps <= 99)) { msg.className = 'msg'; msg.textContent = `${label}: reps should be a whole number from 1 to 99.`; return; }
    row.reps = reps;
    for (const f of ['pct_set1', 'pct_set2', 'pct_set3']) {
      const p = num(f); if (!(p >= 1 && p <= 150)) { msg.className = 'msg'; msg.textContent = `${label}: each % should be between 1 and 150.`; return; }
      row[f] = Math.round(p * 10) / 1000;
    }
    if (!dl) { const j = num('jk_sets'); if (!(Number.isInteger(j) && j >= 1 && j <= 99)) { msg.className = 'msg'; msg.textContent = `${label}: Jokers should be a whole number from 1 to 99.`; return; } row.jk_sets = j; }
    upd.push([w, row]);
  }
  btn.disabled = true; msg.className = 'msg ok'; msg.textContent = 'Saving…';
  const res = await Promise.all(upd.map(([w, row]) => sb.from('week_scheme').update(row).eq('week', w).select('week')));
  const bad = res.find(r => r.error || !r.data || !r.data.length);
  if (bad) { btn.disabled = false; msg.className = 'msg'; msg.textContent = bad.error ? 'Couldn’t save: ' + bad.error.message : 'Couldn’t save. The update 2 SQL may not have been run yet.'; return; }
  upd.forEach(([w, row]) => Object.assign(S.scheme[w], row));
  renderAdmin('Saved ✓', true);
}

/* ========= events ========= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'menu') { S.menuOpen = !S.menuOpen; renderHome(true); }
  else if (a === 'signout') doSignOut();
  else if (a === 'retry') { S.loaded = false; route(); }
  else if (a === 'note') openNote();
  else if (a === 'notedone') { S.calc.note = $('#notetext').value; $('#notesheet').remove(); syncAll(); }
  else if (a === 'save') saveWorkout();
  else if (a === 'savesettings') saveSettings();
  else if (a === 'rmview') { S.rm.view = b.dataset.v; paintRepMaxes(); }
  else if (a === 'logtoggle') { const id = Number(b.dataset.id), L = S.lg, cur = L.open === 'auto' ? (logFiltered()[0] || {}).id : L.open; L.open = cur === id ? null : id; paintLog(); }
  else if (a === 'logmore') { S.lg.shown += 30; paintLog(); }
  else if (a === 'logclear') { S.lg.wt = ''; $('#logwt').value = ''; S.lg.shown = 30; S.lg.open = 'auto'; paintLog(); }
  else if (a === 'delask') askDelete(b.dataset.id);
  else if (a === 'delcancel') $('#delsheet').remove();
  else if (a === 'delgo') doDelete(b.dataset.id);
  else if (a === 'pgmetric') { S.pg.metric = b.dataset.v; paintProgress(); }
  else if (a === 'pgrange') { S.pg.range = b.dataset.v; paintProgress(); }
  else if (a === 'download') downloadLog($('#delallmsg') || $('#smsg'));
  else if (a === 'delall') askDeleteAll();
  else if (a === 'delallcancel') $('#delallsheet').remove();
  else if (a === 'delallgo') doDeleteAll();
  else if (a === 'saveweeks') saveWeeks();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'logwt' && S.lg) { S.lg.wt = t.value; S.lg.shown = 30; S.lg.open = 'auto'; paintLog(); }
  else if (t.id === 'delconfirm') { const g = $('#delallgo'); if (g) g.disabled = t.value !== 'DELETE'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'rmlift' && S.rm) { S.rm.lift = t.value; loadRepMaxes(); }
  else if (t.id === 'loglift' && S.lg) { S.lg.lift = t.value; S.lg.open = 'auto'; S.lg.shown = 30; loadLog(); }
  else if (t.id === 'pglift' && S.pg) { S.pg.lift = t.value; renderProgress(); }
});
document.addEventListener('submit', e => { if (e.target.id === 'siform') { e.preventDefault(); doSignIn(); } });
document.addEventListener('input', e => {
  const t = e.target, c = S.calc;
  if (!c || parseRoute().path !== '/calc') return;
  if (t.id === 'orm') { c.orm = t.value; syncAll(); }
  else if (t.dataset && t.dataset.key) { c.reps[t.dataset.key] = t.value; syncAll(); }
  setMsg('');
});
document.addEventListener('change', e => {
  const t = e.target, c = S.calc;
  if (!c || parseRoute().path !== '/calc') return;
  if (t.id === 'lift') { c.lift = t.value; c.week = Logic.nextWeek(S.last[c.lift]); c.reps = {}; setOrmFromLast(); renderCalc(); }
  else if (t.id === 'week') { c.week = parseInt(t.value, 10); c.reps = {}; renderCalc(); }
  else if (t.id === 'js') { c.js = parseFloat(t.value); syncAll(); }
});

/* ========= start ========= */
(async function boot() {
  try {
    const { data } = await sb.auth.getSession();
    S.session = data.session;
  } catch (e) { console.error(e); }
  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === 'SIGNED_OUT' && S.session) { S.session = null; setTimeout(route, 0); }
  });
  route();
})();
window.__app = { S, Logic };
</script>
</body>
